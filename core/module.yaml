product:
  type: lib
  platforms: [ android, jvm ] #iosArm64, iosX64, iosSimulatorArm64,

dependencies:
  - $libs.sqlx4k: exported


repositories:
  - url: https://maven.pkg.github.com/BierDav/Exposed
    credentials:
      file: ../local.properties
      usernameKey: githubActor
      passwordKey: githubToken

settings:
  kotlin:
    serialization:
      enabled: true
      version: 1.9.0
    optIns:
      - kotlin.time.ExperimentalTime
      - kotlin.uuid.ExperimentalUuidApi
    freeCompilerArgs: [ "-Xwhen-guards", "-Xexpect-actual-classes", -Xcontext-parameters ]