confettikit = "0.6.0"
kotlinx-coroutines = "1.10.2"
kotlinx-datetime = "0.7.1"
material = "1.13.0"
material-icons = "1.7.3"
koin = "4.1.0"
filekit = "0.11.0"
sqlite = "2.6.0"
kermit = "2.0.4"
