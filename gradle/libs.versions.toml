[versions]
androidx-activity = "1.10.1"
androidx-appcompat = "1.7.1"
androidx-core = "1.17.0"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.9.4"
androidx-splashscreen = "1.0.1"
androidx-room = "2.8.0"
androidx-datastore = "1.1.7"
androidx-work = "2.10.5"
confettikit = "0.6.0"
kotlinx-coroutines = "1.10.2"
kotlinx-datetime = "0.7.1"
material = "1.13.0"
koin = "4.1.0"
filekit = "0.11.0"
sqlite = "2.6.0"
kermit = "2.0.4"
sqlx4k = "1.4.17"

# https://central.sonatype.com/artifact/com.github.jsqlparser/jsqlparser
# https://github.com/JSQLParser/JSqlParser
jsqlparser = "5.3"
# https://mvnrepository.com/artifact/org.apache.calcite/calcite-core/1.40.0
# https://github.com/apache/calcite
calcite = "1.41.0"
# https://github.com/smyrgeorge/log4k
log4k = "1.1.2"
# https://github.com/xerial/sqlite-jdbc
sqlite-jdbc = "3.50.3.0"


[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splashscreen" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version = "2.9.0" }

androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "androidx-datastore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-compose-viewmodel-navigation = { module = "io.insert-koin:koin-compose-viewmodel-navigation", version.ref = "koin" }


google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
confettikit = { module = "io.github.vinceglb:confettikit", version.ref = "confettikit" }
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kpermissions-api = "io.github.the-best-is-best:KPermissionsApi:1.1.0"
kpermissions-notification = "io.github.the-best-is-best:kpermissions-notification:1.1.0"
sqlx4k-codegen = { module = "at.quickme.ksync:sqlx4k-codegen", version.ref = "sqlx4k" }
sqlx4k = { module = "at.quickme.ksync:sqlx4k", version.ref = "sqlx4k" }
sqlx4k-sqlite = { module = "at.quickme.ksync:sqlx4k-sqlite", version.ref = "sqlx4k" }
ksp = "com.google.devtools.ksp:symbol-processing-api:2.3.1"
kotlinpoet = "com.squareup:kotlinpoet:2.2.0"
kotlinpoet-ksp = "com.squareup:kotlinpoet-ksp:2.2.0"
jsqlparser = { module = "com.github.jsqlparser:jsqlparser", version.ref = "jsqlparser" }
calcite-core = { module = "org.apache.calcite:calcite-core", version.ref = "calcite" }
log4k-slf4j = { module = "io.github.smyrgeorge:log4k-slf4j", version.ref = "log4k" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

