product: jvm/app

dependencies:
  - $compose.foundation
  - $compose.material3
  - $compose.desktop.currentOs
  - org.jetbrains.compose.material:material-icons-core:1.7.3
  - ../../client
  - ../../core
  - ../shared
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.sqlx4k.sqlite

repositories:
  - url: https://maven.pkg.github.com/BierDav/Exposed
    credentials:
      file: ../../local.properties
      usernameKey: githubActor
      passwordKey: githubToken


settings:
  kotlin:
    serialization: json
    ksp:
      processors:
        - ../../codegen
      processorOptions:
        output-package: at.ksync.example.codegen
    optIns: [ kotlin.uuid.ExperimentalUuidApi ]
  compose:
    enabled: true